name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build ESP32-S3 recovery and temperature firmware with pinned ESP-IDF
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/project"
          -w /project
          espressif/idf:v5.5.3
          bash -lc 'idf.py -C firmware/ac-sensor-node-esp32s3 set-target esp32s3 &&
          idf.py -C firmware/ac-sensor-node-esp32s3 build &&
          idf.py -C firmware/ac-temperature-bench-esp32s3 set-target esp32s3 &&
          idf.py -C firmware/ac-temperature-bench-esp32s3 build'
      - name: Verify source, release evidence, and compiled component boundaries
        run: >-
          python3 tools/verify_repository.py
          --recovery-build-dir firmware/ac-sensor-node-esp32s3/build
          --temperature-build-dir firmware/ac-temperature-bench-esp32s3/build
