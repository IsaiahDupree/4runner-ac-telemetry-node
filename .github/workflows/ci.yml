name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 recovery firmware with pinned ESP-IDF
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/project"
          -w /project/firmware/ac-sensor-node-esp32s3
          espressif/idf:v5.5.3
          bash -lc 'idf.py set-target esp32s3 && idf.py build'
      - name: Verify source, release evidence, and compiled component boundary
        run: python3 tools/verify_repository.py --build-dir firmware/ac-sensor-node-esp32s3/build
